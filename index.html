<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mewbg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chandrakiran, ein erfahrener Fullstack Webentwickler, präsentiert seine neuesten Projekte, die mit dem MERN-Stack entwickelt wurden."
    />
    <title>Chandrakiran - Portfolioseite</title>
    <!-- Detect theme immediately to prevent screen flashing -->
    <script>
      (function() {
        const path = window.location.pathname;
        let theme = 'dark';
        if (path.endsWith('/l') || path === '/l' || path.includes('/l/')) {
          theme = 'light';
        } else {
          const savedTheme = localStorage.getItem('theme');
          if (savedTheme) {
            theme = savedTheme;
          }
        }
        document.documentElement.classList.add(theme);
      })();
    </script>
    <!-- Preload fonts to avoid flash of unstyled fonts (FOUT) -->
    <link rel="preload" href="/src/assets/fonts/font4.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/font3.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/font2.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/font1.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Immediate background layout based on active theme class to avoid flash */
      html.dark, html.dark body {
        background-color: #0c1220;
      }
      html.light, html.light body {
        background-color: #ebebeb;
      }
      html, body {
        margin: 0;
        padding: 0;
      }
      #initial-placeholder {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 99999;
      }
      html.dark #initial-placeholder {
        background-color: #0c1220;
        color: #ffffff;
      }
      html.light #initial-placeholder {
        background-color: #ebebeb;
        color: #000000;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255, 255, 255, 0.05);
        border-radius: 50%;
        border-top-color: #ff6a3d;
        animation: spin 1s ease-in-out infinite;
      }
      html.light .spinner {
        border-color: rgba(0, 0, 0, 0.05);
        border-top-color: #ff6a3d;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-placeholder">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
